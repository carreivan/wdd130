<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Entre em contato com a Aventura Selvagem Rafting para tirar dúvidas, fazer perguntas sobre reservas e conhecer nossos serviços.">

    <meta name="author" content="Ivan Carreño">

    <title>Fale Conosco | Aventura Selvagem Rafting</title>

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>

        <img src="imagens/logo.png" alt="Logotipo da Aventura Selvagem Rafting">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>

    </header>

    <main class="contato-main">

        <section class="contato-cabecalho">

            <h1>Fale Conosco - Aventura Selvagem Rafting</h1>

            <address>

                <p>Avenida Paulista, 1000 - São Paulo, SP</p>

                <p>(11) 4002-8922</p>

                <p>
                    <a href="mailto:contato@aventuraselvagem.com">
                        contato@aventuraselvagem.com
                    </a>
                </p>

            </address>

        </section>


        <section class="contato-conteudo">

            <div class="mapa">

                <iframe
                  src="https://www.google.com/maps?q=Avenida+Paulista,+1000,+São+Paulo,+SP&output=embed"
                  width="400" height="400" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Localização da Aventura Selvagem Rafting">
                </iframe>

            </div>


            <form class="formulario-contato">

                <div class="campo-horizontal">

                    <label for="nome">
                        Nome
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>

                </div>


                <div class="campo-horizontal">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite aqui" required>

                </div>


                <fieldset class="finalidade">

                    <legend>
                        Propósito da Mensagem
                    </legend>

                    <label>
                        <input type="radio" name="finalidade" value="duvida-geral" required>

                        Dúvida Geral
                    </label>

                    <label>
                        <input type="radio" name="finalidade" value="reserva">

                        Pergunta sobre Reserva
                    </label>

                    <label>
                        <input type="radio" name="finalidade" value="sugestao">

                        Sugestão
                    </label>

                </fieldset>


                <div class="campo-mensagem">

                    <label for="mensagem">
                        Mensagem
                    </label>

                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite aqui"
                      required></textarea>

                </div>


                <div class="newsletter">

                    <input type="checkbox" id="newsletter" name="newsletter">

                    <label for="newsletter">
                        Por favor, me inscreva na newsletter mensal
                    </label>

                </div>


                <button type="submit">
                    Entrar em Contato!
                </button>

            </form>

        </section>


        <section class="equipe">

            <h2>
                Estamos Aqui para Servi-lo
            </h2>

            <div class="equipe-container">

                <figure>

                    <img src="imagens/funcionario1.jpg" alt="Mariana Silva, gerente de atendimento">

                    <figcaption>
                        Mariana Silva<br>
                        <span>Gerente de Atendimento</span>
                    </figcaption>

                </figure>


                <figure>

                    <img src="imagens/funcionario2.jpg" alt="Carlos Mendes, guia de rafting">

                    <figcaption>
                        Carlos Mendes<br>
                        <span>Guia de Rafting</span>
                    </figcaption>

                </figure>


                <figure>

                    <img src="imagens/funcionario3.jpg" alt="Ana Souza, coordenadora de reservas">

                    <figcaption>
                        Ana Souza<br>
                        <span>Coordenadora de Reservas</span>
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Aventura Selvagem Rafting | Ivan Carreño
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">

                <img src="imagens/facebook.png" alt="Ícone do Facebook">

            </a>

            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">

                <img src="imagens/linkedin.png" alt="Ícone do LinkedIn">

            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">

                <img src="imagens/instagram.png" alt="Ícone do Instagram">

            </a>

        </nav>

    </footer>

</body>

</html>
